<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Reference</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; line-height: 1.6; color: #111; }
    .card { max-width: 900px; margin: 0 auto; padding: 24px; border: 1px solid #ddd; border-radius: 12px; }
    .meta { color: #666; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Document reference</h2>
    <div class="meta">Reference ID: {{ doc_id }}</div>
    <p>This is a placeholder document viewer. In the next step, this page can be wired to your uploaded PDFs and vector-store metadata so clicking a reference opens the exact source document.</p>
  </div>
</body>
</html>
