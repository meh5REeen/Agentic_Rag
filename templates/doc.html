<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Reference</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; line-height: 1.6; color: #111; }
    .card { max-width: 900px; margin: 0 auto; padding: 24px; border: 1px solid #ddd; border-radius: 12px; }
    .meta { color: #666; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Document reference</h2>
    <div class="meta">Reference ID: {{ doc_id }}</div>
    {% if error %}
    <p>{{ error }}</p>
    {% if doc and doc.filename %}
    <p class="meta">Expected file: {{ doc.filename }}{% if doc.file_path %} ({{ doc.file_path }}){% endif %}</p>
    {% endif %}
    {% else %}
    <p>Document metadata is available, but the file could not be opened.</p>
    {% endif %}
  </div>
</body>
</html>
