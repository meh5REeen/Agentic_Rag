<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ filename }} · Page {{ page }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1a1a1a; color: #f0ede8; font-family: Inter, -apple-system, sans-serif; }
    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: #161616;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
    }
    .viewer-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-meta { color: #8a8785; flex-shrink: 0; }
    .viewer-body { height: calc(100% - 44px); }
    .viewer-frame { width: 100%; height: 100%; border: 0; background: #2a2a2a; }
  </style>
</head>
<body>
  <header class="viewer-header">
    <div class="viewer-title" title="{{ filename }}">{{ filename }}</div>
    <div class="viewer-meta">Page {{ page }}</div>
  </header>
  <div class="viewer-body">
    {# Native browser PDF viewer: #page=N jumps to the cited page without CDN PDF.js. #}
    <iframe
      class="viewer-frame"
      title="{{ filename }}"
      src="{{ pdf_url }}#page={{ page }}"
    ></iframe>
  </div>
</body>
</html>
